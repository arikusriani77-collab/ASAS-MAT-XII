<style>
:root{--bg:#eef6f4;--card:#fff;--tx:#14231f;--mu:#566f68;--pr:#0f766e;--on:#fff;--bd:#cfe3de;--rd:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0a1412;--card:#12201d;--tx:#e6f2ef;--mu:#93aea7;--pr:#34d3b6;--on:#032620;--bd:#27403a;--rd:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,button{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 4px}
label{display:block;margin:12px 0 4px;font-weight:600}
select,input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);-webkit-user-select:text;user-select:text}
button{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}

.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:8px;font-weight:600}

.opt input{margin-top:5px}
.tag{display:inline-block;font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 9px;margin-left:6px;color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--bd);padding:8px;text-align:left}th{font-size:.85rem;color:var(--mu)}td.c{text-align:center;width:64px}
#ov{position:fixed;inset:0;background:rgba(4,16,14,.96);color:#fff;display:none;z-index:50;align-items:center;justify-content:center;text-align:center;padding:24px}
#ov div{max-width:420px}#ov h2{color:#ff8a80}
.note{margin-top:10px;padding:8px 12px;border-left:4px solid var(--pr);background:var(--bg);border-radius:6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{width:38px;padding:7px 0;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px}.chip.ok{background:var(--bd)}.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.navb{display:flex;justify-content:space-between;gap:10px}
/* ===== halaman muka ===== */
.hero{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(125deg,#042f2e,#0f766e,#0e7490,#166534,#042f2e);background-size:400% 400%;animation:bg 20s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fl span{position:absolute;bottom:-60px;font-weight:700;color:rgba(255,255,255,.16);animation:naik linear infinite;font-family:Georgia,serif}
@keyframes naik{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-115vh) rotate(300deg);opacity:0}}
.hc{position:relative;z-index:2;width:100%;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.cover{background:rgba(3,32,30,.55);border:1px solid rgba(253,230,138,.35);border-radius:26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;text-align:center;padding:0;overflow:hidden;animation:muncul .9s ease both;box-shadow:0 20px 56px rgba(0,20,18,.5)}
@keyframes muncul{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.cover .top{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#3b2500;font-weight:800;letter-spacing:.16em;font-size:.72rem;padding:9px 12px}
.cover .body{padding:20px 20px 22px}
.cover .sch{letter-spacing:.14em;font-size:.8rem;text-transform:uppercase;opacity:.85;animation:muncul .9s .15s ease both}
.cover h1{font-size:1.9rem;line-height:1.15;margin:8px 0 6px;animation:muncul .9s .3s ease both}
.cover h1 span{color:#fde68a}
.cover .thn{display:inline-block;background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.55);color:#fde68a;border-radius:20px;padding:3px 14px;font-weight:700;font-size:.92rem;animation:muncul .9s .4s ease both}
.cover .mp{margin-top:8px;font-size:1.02rem;animation:muncul .9s .5s ease both}
.cover .guru{margin-top:14px;opacity:.85;font-size:.9rem;animation:muncul .9s 1.2s ease both}
.gbr{display:block;width:100%;max-width:340px;height:auto;margin:14px auto 6px;overflow:visible}
.gbr .bt{transform-box:fill-box;transform-origin:50% 100%;animation:tumbuh .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tumbuh{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gbr .kurva{stroke-dasharray:1;stroke-dashoffset:0;animation:gambar 1.8s ease-out 1.2s both}
@keyframes gambar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.gbr .dot{transform-box:fill-box;transform-origin:center;animation:titik .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes titik{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.gbr .dd{transform-box:fill-box;transform-origin:center;animation:titik .6s cubic-bezier(.2,1.8,.4,1) both,melayang 2.6s ease-in-out 2.6s infinite}
@keyframes melayang{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gbr .tx{opacity:0;animation:titik .6s ease 2s forwards}
.mat{display:flex;justify-content:center;gap:8px;margin:6px 0 2px;animation:muncul .9s .7s ease both}
.mat span{border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:2px 14px;font-size:.82rem;letter-spacing:.06em}
.info{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0;animation:muncul .9s .8s ease both}
.info span{background:rgba(0,0,0,.28);border-radius:20px;padding:4px 12px;font-size:.85rem}
.rules{text-align:left;background:rgba(0,0,0,.3);border-left:4px solid #fbbf24;border-radius:12px;padding:12px 16px 12px 34px;margin:12px 0;font-size:.92rem;animation:muncul .9s .95s ease both}
.rules li{margin:5px 0}.rules b{color:#fde68a}
.btn-mulai{background:linear-gradient(90deg,#fde68a,#fbbf24);color:#3b2500;font-size:1.1rem;font-weight:800;padding:14px 40px;border-radius:40px;box-shadow:0 0 0 0 rgba(251,191,36,.7);animation:denyut 1.8s ease-in-out infinite,muncul .9s 1.1s ease both}
@keyframes denyut{0%{box-shadow:0 0 0 0 rgba(251,191,36,.65)}70%{box-shadow:0 0 0 18px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
.btn-mulai:disabled{animation:none;opacity:.65;cursor:not-allowed;box-shadow:none}
.lock{margin:10px 0;padding:9px 12px;border-radius:12px;background:rgba(255,90,90,.28);font-size:.93rem;display:none}
.back{background:none;color:var(--pr);padding:0 0 6px;font-weight:600;border:0}
@media(prefers-reduced-motion:reduce){.hero,#fl span,.cover,.cover *,.gbr *,.btn-mulai,.info,.rules,.mat{animation:none!important;opacity:1!important}}
.err{color:var(--rd);font-size:.9rem;margin-top:8px}
</style>

<body>
<div id="app"></div>
<div id="ov"><div><h2>⚠ Pelanggaran Terdeteksi</h2><p id="ovm"></p><button id="ovb">Kembali ke Ujian</button></div></div>

<script>
/* ================= PENGATURAN (ubah di sini) ================= */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyHW0iesmGV88-iPvNmc1RSvMwNESvkCnvTNjtZR42cJgb6S4Nxggo0xfBoUwKJJDYiDQ/exec",
  JUDUL: "Asesmen Akhir Semester Ganjil",
  TAHUN: "2026/2027",
  MAPEL: "Matematika",
  KELAS: "XII",
  SEKOLAH: "SMAN 1 Ngamprah",
  GURU: "Ari Kusriani Iman, S.Pd.",
  JUMLAH_SOAL: 20,       // hanya tampilan; jumlah soal sebenarnya = isi fungsi buatSoal()
  KESEMPATAN: 1,         // hanya tampilan; harus sama dengan MAKS_PERCOBAAN di Code.gs
  DURASI_MENIT: 90,
  MAKS_PELANGGARAN: 3,   // setelah ini, jawaban otomatis dikirim
};

/* ================= BANK SOAL (parameter berbeda tiap paket) ================= */
const num = x => String(x).replace("-","−");
const dc = (x,d=2) => num(String(+(+x).toFixed(d)).replace(".",","));   // desimal gaya Indonesia
const rp = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const sum = a => a.reduce((s,x)=>s+x,0);
const gcd = (a,b) => b?gcd(b,a%b):a;
const fr = (n,d) => {const g=gcd(n,d);n/=g;d/=g;return d==1?String(n):n+"/"+d};   // pecahan paling sederhana
const sb = n => String(n).replace(/\d/g,d=>"₀₁₂₃₄₅₆₇₈₉"[d]);   // angka subskrip untuk nPr / nCr
const fact = n => n<=1?1:n*fact(n-1);
const Pm = (n,r) => r>n?0:fact(n)/fact(n-r);
const Cm = (n,r) => r>n?0:Pm(n,r)/fact(r);
const tb = (h,rows) => `<div style="overflow-x:auto;margin:8px 0"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const tbh = rows => `<div style="overflow-x:auto;margin:8px 0"><table>${rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(x=>`<td class="c">${x}</td>`).join("")}</tr>`).join("")}</table></div>`;

/* Setiap siswa (dan tiap percobaan) mendapat angka berbeda: seluruh parameter diacak dari seed.
   Soal 1–10  : STATISTIKA (penyajian data, pemusatan data, penyebaran data)
   Soal 11–20 : PELUANG    (pencacahan, permutasi, kombinasi, peluang kejadian, peluang majemuk) */
function buatSoal(seed){
  const R=rng(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pc=a=>a[Math.floor(R()*a.length)];
  const pick=(a,n)=>shuf(a,R).slice(0,n);
  const komp=(k,n,mn=1)=>{const f=Array(k).fill(mn);for(let i=0;i<n-k*mn;i++)f[Math.floor(R()*k)]++;return f}; // k frekuensi berjumlah n
  const kls=(lo0,p,k)=>Array.from({length:k},(_,i)=>[lo0+i*p,lo0+i*p+p-1]);
  const rowsK=(K,f)=>K.map((c,i)=>[`${c[0]} – ${c[1]}`,f[i]]);
  const bol3=()=>{let f;do{f=[R()<.5,R()<.5,R()<.5].map(Number)}while(f[0]+f[1]+f[2]==0||f[0]+f[1]+f[2]==3);return f};
  const bersih=r=>Math.abs(r*100-Math.round(r*100))<1e-7; // hasil maksimal 2 desimal
  const KO=[[1,2,3],[1,3],[2,4],[4],[1,2,3,4]];
  const lb=c=>c.length==4?"Semua pernyataan benar":c.length==1?`Hanya pernyataan (${c[0]}) yang benar`:c.length==2?`Pernyataan (${c[0]}) dan (${c[1]}) benar`:`Pernyataan (${c.slice(0,-1).join("), (")}), dan (${c[c.length-1]}) benar`;
  const kmb=(tag,intro,mk)=>{const bn=pc([0,1,2,3,4]),T=new Set(KO[bn]),st=mk(j=>T.has(j));
    return {type:"pg",fix:1,tag,q:intro+"<br>"+st.map((x,j)=>`(${j+1}) ${x}`).join("<br>")+"<br>Pernyataan yang benar adalah …",
      o:KO.map((c,j)=>({t:`${"ABCDE"[j]}. ${lb(c)}`,ok:j==bn?1:0}))}};
  const cnt2=k=>{let c=0;for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)if(i+j==k)c++;return c}; // banyak pasangan dua dadu berjumlah k
  const S=[];

  /* ---------- STATISTIKA ---------- */
  // 1. Pilihan ganda kompleks – penyajian data (diagram, histogram, poligon, ogive, tepi kelas)
  {const Tr=["Diagram garis digunakan untuk menggambarkan keadaan yang berlangsung secara kontinu, misalnya perkembangan jumlah penjualan dari waktu ke waktu.",
     "Pada diagram lingkaran, besar sudut juring = (frekuensi data ÷ jumlah seluruh data) × 360°.",
     "Poligon frekuensi dibuat dengan menghubungkan titik-titik yang absisnya titik tengah kelas dan ordinatnya frekuensi kelas.",
     "Ogive positif (kurang dari) dibuat dengan tepi atas kelas sebagai absis dan frekuensi kumulatif kurang dari sebagai ordinat.",
     "Pada histogram, alas setiap persegi panjang menunjukkan panjang kelas dan tingginya menunjukkan frekuensi kelas.",
     "Untuk data bulat, tepi bawah suatu kelas diperoleh dengan mengurangkan 0,5 dari batas bawah kelas tersebut."],
    Fl=["Pada histogram, tinggi setiap persegi panjang menunjukkan panjang kelas.",
     "Poligon frekuensi dibuat dengan menghubungkan tepi atas setiap kelas dengan frekuensinya.",
     "Ogive negatif (lebih dari) dibuat dengan tepi atas kelas sebagai absis dan frekuensi kumulatif kurang dari sebagai ordinat.",
     "Jumlah besar seluruh sudut juring pada diagram lingkaran adalah 180°.",
     "Histogram adalah diagram garis yang khusus digunakan untuk menyajikan data tunggal.",
     "Untuk data bulat, tepi atas suatu kelas sama dengan batas atas kelas tersebut."];
   S.push({type:"pk",tag:"Penyajian Data (Pilihan Ganda Kompleks)",
    q:"Pilih <b>semua</b> pernyataan yang <b>benar</b> tentang penyajian data (jawaban lebih dari satu).",
    o:[...pick(Tr,2).map(t=>({t,ok:1})),...pick(Fl,2).map(t=>({t,ok:0}))]});}
  // 2. Benar / Salah – mean, median, modus dari tabel frekuensi (data tunggal)
  {const V=[5,6,7,8,9,10];let f;do{f=komp(6,20)}while(f.filter(x=>x==Math.max(...f)).length>1);
   const e=V.flatMap((v,i)=>Array(f[i]).fill(v)),mean=sum(e)/20,med=(e[9]+e[10])/2,mo=V[f.indexOf(Math.max(...f))],fl=bol3(),
    wm=mean+pc([.3,.5])*(mean<8?1:-1),wd=med+(med<8?1:-1),wo=pick(V.filter(v=>v!=mo),1)[0];
   S.push({type:"bs",tag:"Mean, Median, Modus (Benar / Salah)",
    q:`Nilai ujian suatu mata pelajaran dari 20 siswa disajikan pada tabel berikut.${tbh([["Nilai",...V],["Frekuensi",...f]])}Tentukan apakah setiap pernyataan berikut <b>Benar</b> atau <b>Salah</b>.`,
    o:[{t:`Rata-rata (mean) nilai tersebut adalah ${dc(fl[0]?mean:wm)}.`,ok:fl[0]},
       {t:`Median data tersebut adalah ${dc(fl[1]?med:wd)}.`,ok:fl[1]},
       {t:`Modus data tersebut adalah ${fl[2]?mo:wo}.`,ok:fl[2]}]});}
  // 3. PG pernyataan – rata-rata gabungan
  {const C=pc([{a:"siswa putra",b:"siswa putri",t:"tinggi badan",u:" cm",lo:155,hi:176},{a:"siswa kelas XII-A",b:"siswa kelas XII-B",t:"nilai ulangan matematika",u:"",lo:60,hi:90}]);
   let n1=30,n2=10,P=170,W=166,G=169;
   for(let t=0;t<800;t++){const a=pc([20,24,30,36,18]),b=pc([10,12,15,8,6]),x=ri(C.lo,C.hi),y=ri(C.lo,C.hi),g=(x*a+y*b)/(a+b);
     if(Number.isInteger(g)&&x!=y&&g!=x&&g!=y){n1=a;n2=b;P=x;W=y;G=g;break}}
   S.push(kmb("Rata-rata Gabungan (Pernyataan)",
    `Dalam suatu kelas terdapat ${n1} ${C.a} dan ${n2} ${C.b}. Rata-rata ${C.t} ${C.a} adalah ${P}${C.u}, rata-rata ${C.t} ${C.b} adalah ${W}${C.u}, dan rata-rata ${C.t} seluruh siswa adalah ${G}${C.u}. Perhatikan pernyataan-pernyataan berikut!`,
    T=>[`Jumlah ${C.t} seluruh ${C.a} adalah ${T(1)?n1*P:n2*P}${C.u}.`,
        `Jumlah ${C.t} seluruh siswa adalah ${T(2)?G*(n1+n2):G*(n1+n2)+10}${C.u}.`,
        `Rata-rata ${C.t} ${C.b} dapat dihitung dengan rumus (${n1+n2} × ${G} − ${n1} × ${P}) ÷ ${n2} = ${T(3)?W:W+pc([-2,2])}${C.u}.`,
        T(4)?`Rata-rata seluruh siswa (${G}${C.u}) lebih dekat ke rata-rata ${C.a} karena anggotanya lebih banyak.`:`Rata-rata seluruh siswa sama dengan rata-rata biasa kedua kelompok, yaitu ${dc((P+W)/2)}${C.u}.`]))}
  // 4. PG – mean data berkelompok (panjang kelas ganjil sehingga titik tengah kelas bilangan bulat)
  {const p=pc([3,5,7,9]),h=(p-1)/2,n=pc([20,25,50]),K=kls(ri(25,55),p,5),mid=K.map(c=>c[0]+h),f=komp(5,n),mean=sum(f.map((x,i)=>x*mid[i]))/n;
   S.push({type:"pg",tag:"Mean Data Berkelompok",
    q:`Perhatikan tabel distribusi frekuensi berikut!${tb(["Nilai","Frekuensi"],rowsK(K,f))}Rata-rata (mean) data tersebut adalah …`,
    o:pgo(mean,[mean-h,mean+h,Math.round(sum(mid)/5),mean+1,mean-1],x=>dc(x),.5)});}
  // 5. PG – median data berkelompok
  {const p=pc([5,10]),k=pc([5,6]);let K,f,n,i,F,Tb,r;
   for(let t=0;t<5000;t++){K=kls(p==5?pc([30,35,40,45,50]):pc([30,40,50]),p,k);f=Array.from({length:k},()=>ri(2,14));n=sum(f);if(n%2)continue;
     let c=0;i=0;while(c+f[i]<n/2)c+=f[i++];F=c;Tb=K[i][0]-.5;r=(n/2-F)/f[i]*p;if(bersih(r))break}
   const Me=Tb+r;
   S.push({type:"pg",tag:"Median Data Berkelompok",
    q:`Perhatikan tabel distribusi frekuensi berikut!${tb(["Nilai","Frekuensi"],rowsK(K,f))}Median data tersebut adalah …`,
    o:pgo(Me,[Tb+n/2/f[i]*p,K[i][1]+.5+r,K[i][0]+r,Tb-r,Tb+(n/2-F)/f[i]],x=>dc(x),.5)});}
  // 6. PG – modus data berkelompok
  {const p=pc([5,10]),k=pc([5,6]);let K,f,m,b1,b2,r;
   for(let t=0;t<5000;t++){K=kls(p==5?pc([30,35,40,45,50]):pc([30,40,50]),p,k);f=Array.from({length:k},()=>ri(2,16));
     const mx=Math.max(...f);m=f.indexOf(mx);if(f.filter(x=>x==mx).length>1||m==0||m==k-1)continue;
     b1=f[m]-f[m-1];b2=f[m]-f[m+1];r=b1/(b1+b2)*p;if(bersih(r))break}
   const Tb=K[m][0]-.5,Mo=Tb+r;
   S.push({type:"pg",tag:"Modus Data Berkelompok",
    q:`Perhatikan tabel distribusi frekuensi berikut!${tb(["Nilai","Frekuensi"],rowsK(K,f))}Modus data tersebut adalah …`,
    o:pgo(Mo,[Tb+b2/(b1+b2)*p,K[m][0]+r,Tb+b1/(b1+b2),Tb+p/2,K[m][1]+.5+r],x=>dc(x),.5)});}
  // 7. PG – kuartil / desil / persentil data berkelompok
  {const M=pc([["kuartil bawah (Q₁)",1,4],["kuartil atas (Q₃)",3,4],["desil ke-2 (D₂)",2,10],["desil ke-8 (D₈)",8,10],["persentil ke-40 (P₄₀)",40,100],["persentil ke-70 (P₇₀)",70,100]]);
   let p,K,f,n,pos,c,ix,F,Tb,r;
   for(let t=0;t<20000;t++){p=pc([5,9]);K=kls(pc([20,26,31,36,40]),p,pc([5,6]));f=K.map(()=>ri(3,20));n=sum(f);pos=M[1]*n/M[2];
     c=0;ix=0;while(c+f[ix]<pos)c+=f[ix++];F=c;Tb=K[ix][0]-.5;r=(pos-F)/f[ix]*p;if(bersih(r)&&r>0)break}
   S.push({type:"pg",tag:"Kuartil, Desil, Persentil",
    q:`Perhatikan tabel distribusi frekuensi berikut!${tb(["Ukuran","Frekuensi"],rowsK(K,f))}Nilai ${M[0]} dari data tersebut adalah …`,
    o:pgo(Tb+r,[Tb+pos/f[ix]*p,K[ix][1]+.5+r,K[ix][0]+r,Tb-r,Tb+(pos-F)/f[ix]],x=>dc(x),.5)});}
  // 8. PG pernyataan – jangkauan, kuartil, simpangan kuartil data tunggal
  {let n,s,Q1,Q3,v;

function pgo(c,d,f=num,st){ // c = jawaban benar, d = calon pengecoh, f = format tampilan, st = langkah pengisi bila pengecoh kurang
  st=st||Math.max(1,Math.round(Math.abs(c)*.07));
  const seen=new Set([f(c)]),u=[];
  const add=v=>{if(u.length>=4||!(v>0))return;const s=f(v);if(!seen.has(s)){seen.add(s);u.push(v)}};
  d.forEach(add);
  for(let j=1;u.length<4&&j<60;j++){add(c+j*st);add(c-j*st)}
  return [c,...u].map((v,i)=>({t:f(v),ok:i==0?1:0}));
}
function pgf(cn,td,ds=[]){ // jawaban benar berupa pecahan cn/td; ds = calon pengecoh [[pembilang,penyebut],...]
  const c=fr(cn,td),seen=new Set([c]),u=[];
  const add=(n,d)=>{if(u.length>=4||!(n>0)||!(d>0)||n>=d||n%1||d%1)return;const s=fr(n,d);if(!seen.has(s)){seen.add(s);u.push(s)}};
  ds.forEach(x=>add(x[0],x[1]));
  [[cn+1,td],[cn-1,td],[td-cn,td],[cn,td+1],[cn,td-1],[cn+2,td],[cn-2,td],[cn*2,td],[1,td],[cn,td*2],[cn+3,td],[cn+1,td+1],[cn,td+2],[cn+1,td+2],[cn+4,td],[cn-3,td]].forEach(x=>add(x[0],x[1]));
  return [c,...u].map((v,i)=>({t:v,ok:i==0?1:0}));
}

function shuf(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  // kiri: histogram + poligon frekuensi (Statistika) · kanan: dua dadu (Peluang)
  const H=[16,32,52,76,60,38,18],pts=H.map((hh,i)=>[22+i*22,112-hh]);
  const bar=H.map((hh,i)=>`<rect class="bt" x="${12+i*22}" y="${112-hh}" width="19" height="${hh}" rx="3" fill="url(#gb)" style="animation-delay:${0.6+i*0.12}s"/>`).join("");
  const dot=pts.map(([x,y],i)=>`<circle class="dot" cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#fbbf24" stroke-width="2" style="animation-delay:${1.4+i*0.25}s"/>`).join("");
  const pip=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="4.2" fill="#0f3f3a"/>`;
  const die=(x,y,rot,p,d)=>`<g transform="translate(${x} ${y}) rotate(${rot} 26 26)"><g class="dd" style="animation-delay:${d}s"><rect width="52" height="52" rx="11" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>${p.map(q=>pip(q[0],q[1])).join("")}</g></g>`;
  return `<svg class="gbr" viewBox="0 0 330 156" role="img" aria-label="Histogram dan poligon frekuensi serta dua buah dadu">
   <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
   <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   <line x1="6" y1="114" x2="172" y2="114" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
   ${bar}
   <path class="kurva" pathLength="1" d="M${pts.map(p=>p.join(",")).join(" L")}" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>
   ${dot}
   <line x1="186" y1="114" x2="324" y2="114" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
   ${die(196,34,-12,[[13,13],[39,13],[26,26],[13,39],[39,39]],1.6)}
   ${die(256,50,14,[[13,13],[39,39],[26,26]],1.9)}
   <text class="tx" x="8" y="132" font-size="11.5" fill="#fff" fill-opacity=".92" font-family="Georgia,serif" font-style="italic">x̄ , Me , Mo , Q , S</text>
   <text class="tx" x="8" y="148" font-size="10" fill="#fff" fill-opacity=".7" font-family="system-ui,sans-serif" letter-spacing=".1em">STATISTIKA</text>
   <text class="tx" x="188" y="132" font-size="11.5" fill="#fde68a" font-family="Georgia,serif" font-style="italic">P(A) = n(A) / n(S)</text>
   <text class="tx" x="188" y="148" font-size="10" fill="#fde68a" fill-opacity=".85" font-family="system-ui,sans-serif" letter-spacing=".1em">PELUANG</text>
  </svg>`;
}
function depan(msg){
  const sim=["Σ","x̄","Me","Mo","S","Q","%","f","n!","P(A)","nCr","nPr","∪","∩","D","P"];
  app.innerHTML=`<div class="hero"><div id="fl"></div><div class="wrap hc"><div class="card cover">
    <div class="top">UJIAN DARING · LAYAR PENUH</div>
    <div class="body">
    <div class="sch">${CONFIG.SEKOLAH}</div>
    <h1>Asesmen Akhir<br><span>Semester Ganjil</span></h1>
    <div class="thn">Tahun Pelajaran ${CONFIG.TAHUN}</div>
    <div class="mp">${CONFIG.MAPEL} · Kelas ${CONFIG.KELAS}</div>
    ${gambar()}
    <div class="mat"><span>Statistika</span><span>Peluang</span></div>
    <div class="info"><span>📝 ${CONFIG.JUMLAH_SOAL} soal</span><span id="chd">⏱ ${DUR} menit</span>${CONFIG.KESEMPATAN>1?`<span>🔁 ${CONFIG.KESEMPATAN} kesempatan · nilai terbesar diambil</span>`:""}</div>
    <ul class="rules"><li>Ujian berjalan dalam <b>layar penuh</b>.</li>
    <li>Dilarang pindah tab/aplikasi, membuka aplikasi lain, atau menyalin soal.</li>
    <li>Setiap pelanggaran dicatat dan dilihat guru. Batas <b><span id="mvt">${MAXV}</span> kali</b>, setelah itu jawaban otomatis dikirim.</li>
    <li>Layar HP dijaga <b>tetap menyala</b> selama ujian. Jangan menekan tombol power. Saat menghitung di kertas, biarkan HP terbuka di halaman soal.</li></ul>
    <div class="err" style="color:#ffd0d0">${msg||""}</div>
    <div class="lock" id="stat"></div>
    <button class="btn-mulai" id="mulai0" disabled>Memeriksa…</button>
    <div class="guru">Guru: ${CONFIG.GURU}</div>
    </div></div></div></div>`;
  const f=$("#fl");for(let i=0;i<16;i++){const s=document.createElement("span");s.textContent=sim[i%sim.length];
    s.style.cssText=`left:${Math.random()*95}%;font-size:${22+Math.random()*44}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;f.appendChild(s)}
  $("#mulai0").onclick=()=>{clearInterval(pollId);if($("#mulai0").dataset.lanjut)lanjut();else login(msg)};
  clearInterval(pollId);cekStatus();pollId=setInterval(cekStatus,10000);
}
let DUR=CONFIG.DURASI_MENIT,MAXV=CONFIG.MAKS_PELANGGARAN,pollId=null;
function tersisa(){try{const o=JSON.parse(localStorage.getItem(KEY));return o&&!o.done?o:null}catch(e){return null}}
function lanjut(){const o=tersisa();if(!o)return;st=o;st.v++;st.log.push("Memuat ulang halaman");save();grace=Date.now()+4000;fs();mulai()}
async function cekStatus(){ // izin guru + jadwal dibaca dari sheet "Pengaturan"; dicek ulang tiap 10 detik
  const b=$("#mulai0"),s=$("#stat");if(!b||!s)return;
  try{const J=await(await fetch(CONFIG.SCRIPT_URL+"?aksi=status&t="+Date.now())).json();
    if(J.durasi>0){DUR=J.durasi;const c=$("#chd");if(c)c.textContent=`⏱ ${DUR} menit`}
    if(J.batas>0){MAXV=J.batas;const m=$("#mvt");if(m)m.textContent=MAXV}
    if(J.buka){s.style.display="none";b.disabled=false;b.dataset.lanjut="";b.textContent=tersisa()?"Lanjutkan Ujian ▶":"Mulai ▶";if(tersisa())b.dataset.lanjut="1"}
    else if(tersisa()){s.style.display="block";s.textContent="🔒 "+(J.pesan||"Ujian ditutup.")+" Kamu masih punya ujian yang belum selesai.";b.disabled=false;b.dataset.lanjut="1";b.textContent="Lanjutkan Ujian ▶"}
    else{s.style.display="block";s.textContent="🔒 "+(J.pesan||"Ujian belum dibuka.");b.disabled=true;b.dataset.lanjut="";b.textContent="Menunggu izin guru…"}
  }catch(e){s.style.display="block";s.textContent="⚠ Tidak dapat terhubung ke server. Periksa koneksi internet.";b.disabled=true;b.textContent="Mulai ▶"}
}
async function login(msg){
  app.innerHTML=`<div class="wrap"><div class="card"><h1>${CONFIG.JUDUL} ${CONFIG.TAHUN}</h1><p class="mu">Memuat daftar siswa…</p></div></div>`;
  clearInterval(pollId);let D,MK=CONFIG.KESEMPATAN,bk="";
  try{const r=await fetch(CONFIG.SCRIPT_URL+"?aksi=daftar");const J=await r.json();if(J.buka===false){bk=J.pesan||"Ujian belum dibuka."}else{D=J.kelas;MK=Math.min(J.maks||CONFIG.KESEMPATAN,CONFIG.KESEMPATAN);if(J.durasi>0)DUR=J.durasi;if(J.batas>0)MAXV=J.batas;if(!D||!Object.keys(D).length)throw 0}}
  catch(e){app.innerHTML=`<div class="wrap"><div class="card"><h1>Daftar siswa gagal dimuat</h1><p class="mu">Periksa koneksi internet. Jika terus gagal, hubungi guru (sheet "Siswa" mungkin masih kosong).</p><button id="rt">Coba Lagi</button></div></div>`;$("#rt").onclick=()=>login(msg);return}
  if(bk){depan(bk);return}
  const kls=Object.keys(D);
  app.innerHTML=`<div class="wrap"><div class="card"><button class="back" id="bk">‹ Kembali</button><h1>Isi Identitas</h1><div class="mu">${CONFIG.JUDUL} ${CONFIG.TAHUN} · ${CONFIG.SEKOLAH}</div>
  <label>Kelas</label><select id="kl"><option value="">— pilih kelas —</option>${kls.map(k=>`<option>${esc(k)}</option>`).join("")}</select>
  <label>Nama</label><select id="nm" disabled><option value="">— pilih kelas dulu —</option></select>
  <div class="mu" id="inf"></div><div class="err" id="er">${msg||""}</div><br><button id="go">Mulai Ujian</button></div></div>`;
  $("#bk").onclick=()=>depan(msg);
  $("#kl").onchange=()=>{const k=$("#kl").value,n=$("#nm");
    n.disabled=!k;n.innerHTML=k?`<option value="">— pilih nama —</option>`+D[k].map((x,i)=>`<option value="${i}"${x.c>=MK?" disabled":""}>${esc(x.n)}${x.c>=MK?" (percobaan habis)":x.c?` (sudah ${x.c}x)`:""}</option>`).join(""):`<option value="">— pilih kelas dulu —</option>`};
  $("#nm").onchange=()=>{const v=$("#nm").value,k=$("#kl").value;$("#inf").textContent=v===""?"":`Percobaan ke-${D[k][+v].c+1} dari ${MK}.${MK>1?" Nilai yang diambil adalah nilai TERBESAR dari semua percobaan.":""}`};
  $("#go").onclick=()=>{
    const kl=$("#kl").value,ix=$("#nm").value;
    if(!kl||ix==="")return $("#er").textContent="Pilih kelas dan nama kamu.";
    const nm=D[kl][+ix].n,ab=+ix+1,c0=D[kl][+ix].c;
    if(!tanya(`Kamu memilih:\n${nm}\nKelas ${kl}\n\nSudah benar?`))return;
    const id=(nm+"|"+kl+"|"+ab).toLowerCase(); let old=null;
    try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(old&&old.id==id&&!old.done){st=old;st.v++;st.log.push("Memuat ulang halaman")}
    else{if(old&&!old.done&&old.id!=id)return $("#er").textContent="Ada ujian lain yang belum selesai di perangkat ini.";
      st={id,nm,kl,ab,att:c0+1,mk:MK,dur:DUR,mv:MAXV,cur:0,seed:Math.floor(Math.random()*1e9),start:Date.now(),ans:{},v:0,log:[],done:false}}
    save();grace=Date.now()+4000;fs();mulai();
  };
}
function mulai(){
  const r=rng(st.seed+7);
  qs=shuf(buatSoal(st.seed),r).map(q=>q.o&&!q.fix?{...q,o:shuf(q.o,r)}:q);
  app.innerHTML=`<div class="bar"><span id="b1"></span><span id="b2"></span></div><div class="wrap">${"wakeLock" in navigator?"":`<div class="note" id="wlnote">Penjaga layar tidak didukung di HP ini. Atur <b>Waktu layar (Screen timeout)</b> ke paling lama, dan sentuh layar sesekali saat menghitung.</div>`}<div class="chips" id="chips"></div><div id="soal"></div><div class="navb"><button class="sec" id="prev">‹ Sebelumnya</button><button id="next">Selanjutnya ›</button></div></div>`;
  $("#soal").innerHTML=qs.map((q,i)=>`<div class="card q" style="display:none"><b>Soal ${i+1} dari ${qs.length}</b><span class="tag">${q.tag}</span><div style="margin:12px 0">${q.q}</div>${isi(q)}</div>`).join("");
  $("#chips").innerHTML=qs.map((q,i)=>`<button class="chip" data-c="${i}">${i+1}</button>`).join("");
  document.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("input",()=>{ambil();chips()}));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>tampil(+b.dataset.c));
  $("#prev").onclick=()=>tampil(st.cur-1);
  $("#next").onclick=()=>{if(st.cur<qs.length-1)tampil(st.cur+1);else{
    const k=qs.filter(q=>!jawab(q)).length;
    if(tanya(k?`Masih ada ${k} soal belum dijawab. Tetap kirim sekarang?`:"Semua soal sudah dijawab. Kirim jawaban sekarang?"))submit("Selesai")}};
  pulih();tampil(Math.min(st.cur||0,qs.length-1));renderBar();jagaLayar();
  timerId=setInterval(renderBar,1000);
}
function jawab(q){const a=st.ans[q.id];if(a===undefined)return false;if(q.type=="pk")return a.length>0;if(q.type=="bs")return Object.keys(a).length>0;return true}
function chips(){document.querySelectorAll("[data-c]").forEach((b,i)=>{b.classList.toggle("ok",jawab(qs[i]));b.classList.toggle("on",i==st.cur)})}
function tampil(i){
  if(i<0||i>=qs.length)return;st.cur=i;save();
  document.querySelectorAll(".q").forEach((c,j)=>c.style.display=j==i?"block":"none");
  $("#prev").style.visibility=i==0?"hidden":"visible";
  $("#next").textContent=i==qs.length-1?"Kirim Jawaban ✓":"Selanjutnya ›";
  chips();window.scrollTo(0,0);
}
function isi(q){
  if(q.type=="pg")return q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${q.id}" data-q="${q.id}" value="${j}"><span>${esc(o.t)}</span></label>`).join("");
  if(q.type=="pk")return q.o.map((o,j)=>`<label class="opt"><input type="checkbox" data-q="${q.id}" value="${j}"><span>${esc(o.t)}</span></label>`).join("");
  if(q.type=="bs")return `<table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>`+q.o.map((o,j)=>`<tr><td>${esc(o.t)}</td><td class="c"><input type="radio" name="${q.id}_${j}" data-q="${q.id}" data-j="${j}" value="1"></td><td class="c"><input type="radio" name="${q.id}_${j}" data-q="${q.id}" data-j="${j}" value="0"></td></tr>`).join("")+`</table>`;
  return `<input type="number" inputmode="decimal" data-q="${q.id}" placeholder="Tulis jawaban (angka)">`;
}
function ambil(){
  qs.forEach(q=>{
    const els=[...document.querySelectorAll(`[data-q="${q.id}"]`)];
    if(q.type=="pg"){const c=els.find(e=>e.checked);if(c)st.ans[q.id]=+c.value}
    else if(q.type=="pk")st.ans[q.id]=els.filter(e=>e.checked).map(e=>+e.value);
    else if(q.type=="bs"){const m={};els.filter(e=>e.checked).forEach(e=>m[e.dataset.j]=+e.value);st.ans[q.id]=m}
    else if(els[0].value!=="")st.ans[q.id]=parseFloat(els[0].value);
    else delete st.ans[q.id];
  });save();
}
function pulih(){
  qs.forEach(q=>{const a=st.ans[q.id];if(a===undefined)return;
    const els=[...document.querySelectorAll(`[data-q="${q.id}"]`)];
    if(q.type=="pg")els.forEach(e=>e.checked=+e.value===a);
    else if(q.type=="pk")els.forEach(e=>e.checked=a.includes(+e.value));
    else if(q.type=="bs")els.forEach(e=>e.checked=a[e.dataset.j]!==undefined&&a[e.dataset.j]==+e.value);
    else els[0].value=a});
}
function sisa(){return Math.max(0,(st.dur||CONFIG.DURASI_MENIT)*60-Math.floor((Date.now()-st.start)/1000))}
function renderBar(){
  if(!$("#b1"))return;const s=sisa();
  $("#b1").textContent=`${st.nm} · Percobaan ${st.att||1}`;
  $("#b2").textContent=`⏱ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")} · ⚠ ${st.v}/${mv()}${wl?" · 🔆":""}`;
  if(s<=0&&!done)submit("Otomatis (waktu habis)");
}

/* ================= PENILAIAN & PENGIRIMAN ================= */
function nilai(){
  let benar=0;const det=[];
  qs.forEach(q=>{const a=st.ans[q.id];let sk=0;
    if(a!==undefined){
      if(q.type=="pg")sk=q.o[a]&&q.o[a].ok?1:0;
      else if(q.type=="pk"){const k=q.o.map((o,j)=>o.ok?j:-1).filter(j=>j>=0);sk=(k.length==a.length&&k.every(j=>a.includes(j)))?1:0}
      else if(q.type=="bs")sk=q.o.filter((o,j)=>a[j]!==undefined&&a[j]==o.ok).length/q.o.length;
      else sk=Math.abs(a-q.ans)<=(q.tol||1e-6)?1:0}
    benar+=sk;det.push(q.id+":"+(a===undefined?"-":JSON.stringify(a))+"="+(+sk.toFixed(2)))});
  return{benar:+benar.toFixed(2),det};
}
async function cek(){try{const J=await(await fetch(CONFIG.SCRIPT_URL+"?aksi=daftar&t="+Date.now())).json();const x=J.kelas[st.kl][st.ab-1];return !!x&&x.c>=st.att}catch(e){return false}}
async function submit(status){
  if(done)return;done=true;clearInterval(timerId);lepasLayar();ambil&&qs.length&&ambil();
  $("#ov").style.display="none";
  try{if(inFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}
  const h=nilai(),total=qs.length;
  const data={nama:st.nm,kelas:st.kl,absen:st.ab,paket:st.seed.toString(36),skor:+(h.benar/total*100).toFixed(1),benar:h.benar,total,
    sesi:"S"+st.seed,pelanggaran:st.v,logPelanggaran:st.log.join(" | "),durasiMenit:+((Date.now()-st.start)/60000).toFixed(1),status,detail:h.det.join(" ; ")};
  app.innerHTML=`<div class="wrap"><div class="card"><h1>Mengirim jawaban…</h1><p class="mu">Jangan tutup halaman ini.</p></div></div>`;
  let ok=false,res=null;
  for(let i=0;i<3&&!ok;i++){
    try{const r=await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
      const j=await r.json();res=j;ok=j.ok;if(j.batas)break}catch(e){
      try{await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});await new Promise(r=>setTimeout(r,2500));ok=await cek()}catch(e2){await new Promise(r=>setTimeout(r,1500))}}
  }
    const balik=()=>{clearInterval(t);st=null;qs=[];done=false;lastV=0;depan()};let t,c=20;
  if(res&&res.batas){st.done=true;save();app.innerHTML=`<div class="wrap"><div class="card"><h1>Batas percobaan habis</h1><p>Kamu sudah memakai semua kesempatan mengerjakan. Hasil akan disampaikan oleh guru.</p><button id="kb">Kembali</button></div></div>`;$("#kb").onclick=()=>{st=null;qs=[];done=false;depan()};return}
  if(ok){st.done=true;save();const nm=st.nm;
    app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center"><h1>✅ Jawaban terkirim</h1><p>Terima kasih, ${esc(nm)}.</p>
    <p class="mu">Jawabanmu sudah tersimpan. Hasil asesmen akan disampaikan oleh guru.</p>
    <p class="mu">Kembali ke halaman awal dalam <b id="cd">${c}</b> detik…</p><button class="sec" id="kb">Kembali Sekarang</button></div></div>`;
    t=setInterval(()=>{c--;if(c<=0)balik();else $("#cd").textContent=c},1000);
    $("#kb").onclick=balik}
  else{done=false;app.innerHTML=`<div class="wrap"><div class="card"><h1>Gagal mengirim</h1><p>Periksa koneksi internet, lalu tekan tombol di bawah. Jawabanmu tersimpan.</p><button id="rt">Kirim Ulang</button></div></div>`;$("#rt").onclick=()=>submit(status)}
}

/* ================= MULAI ================= */
(function(){
  let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    depan(old&&!old.done?"Ada ujian yang belum selesai. Pilih kelas dan nama yang sama untuk melanjutkan (dihitung 1 pelanggaran).":"");
})();
</script>
</body>
</html>
